syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.grpc";
option java_outer_classname = "FileTransferProto";

service FileService {
  rpc Upload(stream FileChunk) returns (UploadStatus);
  rpc Download(FileRequest) returns (stream FileChunk);
}

message FileChunk {
  string filename = 1;  // only needed in first chunk
  bytes data = 2;
}

message FileRequest {
  string filename = 1;
  string path = 2;
}

message UploadStatus {
  bool success = 1;
  string message = 2;
}
